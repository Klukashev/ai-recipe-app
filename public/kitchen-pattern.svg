<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!--
    A seamless kitchen-theme tile. It is used as a CSS mask rather than a plain
    background image, so the colour comes from the page (see app/layout.tsx) and
    it follows the light/dark theme automatically. Every icon sits well inside
    the 300x300 tile so nothing is clipped where the tile repeats.
  -->
  <g fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

    <!-- chef's toque -->
    <g transform="translate(18 16) rotate(-8)">
      <path d="M10 26c-6-1-9-6-7-11 1-4 5-6 9-5 1-5 6-8 11-6 4-4 11-2 12 4 5 0 8 5 6 10-1 4-4 7-8 8z"/>
      <path d="M10 26v7h21v-7"/>
    </g>

    <!-- whisk -->
    <g transform="translate(128 12) rotate(16)">
      <path d="M20 38V22"/>
      <path d="M20 22c-9-3-9-15 0-18 9 3 9 15 0 18z"/>
      <path d="M20 4v18M13.5 7v12M26.5 7v12"/>
    </g>

    <!-- saucepan -->
    <g transform="translate(232 54) rotate(-6)">
      <path d="M6 16h22v11a5 5 0 0 1-5 5H11a5 5 0 0 1-5-5z"/>
      <path d="M28 20h9"/>
      <path d="M11 10q3-5 0-8M20 10q3-5 0-8"/>
    </g>

    <!-- herb sprig -->
    <g transform="translate(48 132) rotate(10)">
      <path d="M20 38V10"/>
      <path d="M20 31q-9-1-10-10 9 1 10 10z"/>
      <path d="M20 23q9-1 10-10-9 1-10 10z"/>
      <path d="M20 16q-8-2-8-10 8 2 8 10z"/>
    </g>

    <!-- fork -->
    <g transform="translate(152 126) rotate(-22)">
      <path d="M13 4v8M20 4v8M27 4v8"/>
      <path d="M13 12q0 6 7 7 7-1 7-7"/>
      <path d="M20 19v19"/>
    </g>

    <!-- rolling pin -->
    <g transform="translate(236 168) rotate(14)">
      <rect x="10" y="13" width="22" height="11" rx="5.5"/>
      <path d="M3 18.5h7M32 18.5h7"/>
    </g>

    <!-- spoon -->
    <g transform="translate(28 232) rotate(24)">
      <ellipse cx="20" cy="11" rx="7.5" ry="9.5"/>
      <path d="M20 20.5V38"/>
    </g>

    <!-- egg -->
    <g transform="translate(140 244) rotate(-10)">
      <path d="M20 36c-6 0-10-5-10-11 0-7 5-16 10-16s10 9 10 16c0 6-4 11-10 11z"/>
    </g>

    <!-- chef's knife -->
    <g transform="translate(236 244) rotate(-16)">
      <path d="M8 6c8 2 14 7 16 12H8z"/>
      <path d="M8 18v16"/>
    </g>
  </g>
</svg>
